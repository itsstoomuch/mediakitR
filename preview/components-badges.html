<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#EFE3D1;padding:22px 20px;display:flex;flex-direction:column;gap:18px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.label{font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#5A4436;min-width:90px;flex-shrink:0;}
/* pills */
.pill{font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:8px 14px;border-radius:999px;display:inline-block;}
/* badges */
.badge{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:7px 12px;border-radius:999px;display:inline-block;box-shadow:0 4px 10px rgba(61,43,31,.2);}
/* stat sup */
.stat{font-family:'Fraunces',serif;font-size:42px;line-height:1;letter-spacing:-.03em;color:#3D2B1F;}
.stat sup{font-size:14px;color:#C96A4E;vertical-align:super;font-family:'Inter',sans-serif;font-weight:500;}
</style></head><body>

<div class="row">
  <div class="label">Niche pills</div>
  <span class="pill" style="background:#3D2B1F;color:#FBF2E4;">Slow Living</span>
  <span class="pill" style="background:#C96A4E;color:#FBF2E4;">Food</span>
  <span class="pill" style="background:#E8C5C0;color:#3D2B1F;">Beauty &amp; Wellness</span>
  <span class="pill" style="border:1px solid #3D2B1F;color:#3D2B1F;">Calm Routines</span>
</div>

<div class="row">
  <div class="label">Card badges</div>
  <span class="badge" style="background:#C96A4E;color:#FBF2E4;transform:rotate(-5deg)">Egg Recipes</span>
  <span class="badge" style="background:#3D2B1F;color:#FBF2E4;transform:rotate(4deg)">Comfort Food</span>
  <span class="badge" style="background:#E8C5C0;color:#3D2B1F;transform:rotate(-8deg)">Beauty &amp; Self Care</span>
  <span class="badge" style="background:#F3D89B;color:#3D2B1F;transform:rotate(6deg)">Slow Mornings</span>
  <span class="badge" style="background:#6E7A4F;color:#FBF2E4;transform:rotate(5deg)">Garden</span>
  <span class="badge" style="background:#FBF2E4;color:#3D2B1F;border:1px solid #3D2B1F;transform:rotate(-3deg)">Calm Routines</span>
</div>

<div class="row">
  <div class="label">Package ribbon</div>
  <span style="font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;background:#C96A4E;color:#FBF2E4;padding:5px 10px;transform:rotate(4deg);display:inline-block;">most loved</span>
</div>

<div class="row">
  <div class="label">Stat nums</div>
  <div class="stat">207<sup>+</sup></div>
  <div class="stat">46</div>
  <div class="stat">79</div>
</div>

</body></html>
