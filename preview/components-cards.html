<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#EFE3D1;padding:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}

/* Photo card */
.card{position:relative;width:160px;aspect-ratio:3/4;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 14px 30px -18px rgba(61,43,31,.3);}
.card .ph{position:absolute;inset:0;background:center/cover no-repeat;}
.card .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(61,43,31,.72) 0%,rgba(61,43,31,0) 55%);}
.card .lbl{position:relative;z-index:2;padding:14px 14px 16px;color:#FBF2E4;}
.card .cat{font-size:8px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;margin-bottom:4px;}
.card .ttl{font-family:'Fraunces',serif;font-weight:400;font-size:18px;line-height:1.05;letter-spacing:-.02em;}
.card .ttl em{font-style:italic;}
.badge{position:absolute;z-index:3;padding:5px 9px;border-radius:999px;font-size:8px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;box-shadow:0 4px 10px rgba(61,43,31,.25);}

/* Keyword card */
.keyword{background:#FBF2E4;border-radius:4px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;width:200px;box-shadow:0 6px 18px -8px rgba(61,43,31,.2);}
.kw{font-family:'Fraunces',serif;font-size:24px;letter-spacing:-.02em;color:#3D2B1F;font-weight:500;}
.kw em{font-style:italic;color:#C96A4E;}
.kn{font-family:'Fraunces',serif;font-style:italic;color:#5A4436;font-size:12px;}
</style></head><body>

<div class="card">
  <div class="ph" style="background-image:url('../assets/1.jpg')"></div>
  <div class="ov"></div>
  <div class="badge" style="top:10px;right:10px;background:#F3D89B;color:#3D2B1F;transform:rotate(5deg);">Slow Mornings</div>
  <div class="lbl"><div class="cat">7AM — Weekly</div><div class="ttl">The <em>morning</em> hour</div></div>
</div>

<div class="card">
  <div class="ph" style="background-image:url('../assets/food-pink-eggs.png')"></div>
  <div class="ov"></div>
  <div class="badge" style="top:10px;right:10px;background:#C96A4E;color:#FBF2E4;transform:rotate(-5deg);">Egg Recipes</div>
  <div class="lbl"><div class="cat">Food · Simple</div><div class="ttl">The <em>Egg</em> Diaries</div></div>
</div>

<div class="card">
  <div class="ph" style="background-image:url('../assets/food-pasta.png')"></div>
  <div class="ov"></div>
  <div class="badge" style="top:10px;left:10px;background:#E8C5C0;color:#3D2B1F;transform:rotate(-7deg);">Quick Bites</div>
  <div class="lbl"><div class="cat">10-Min Meals</div><div class="ttl">Fast &amp; <em>honest</em> food</div></div>
</div>

<div style="display:flex;flex-direction:column;gap:10px;justify-content:center;">
  <div class="keyword" style="transform:rotate(-.8deg)">
    <div class="kw">Calm</div><div class="kn">the pace</div>
  </div>
  <div class="keyword" style="transform:rotate(.6deg)">
    <div class="kw"><em>Authentic</em></div><div class="kn">the voice</div>
  </div>
  <div class="keyword" style="transform:rotate(-.3deg)">
    <div class="kw">Aesthetic</div><div class="kn">the eye</div>
  </div>
</div>

</body></html>
